name: agent_weave_workspace
publish_to: none
environment:
  sdk: '>=3.12.2 <4.0.0'
workspace:
  - packages/agent_weave
  - packages/agent_weave_openai
  - packages/agent_weave_anthropic
  - packages/agent_weave_ollama
  - packages/agent_weave_dart_frog
  - packages/agent_weave_openrouter
  - packages/agent_weave_together
  - packages/agent_weave_http
  - packages/agent_weave_cloudflare
  - packages/agent_weave_vercel_gateway
  - packages/agent_weave_serverpod
  - packages/agent_weave_serverpod_client
  - packages/agent_weave_serverpod_storage_server
  - packages/agent_weave_serverpod_storage_client
  - examples/serverpod/agent_weave_demo_server
  - examples/serverpod/agent_weave_demo_client
dev_dependencies:
  dart_frog: ^1.2.6
  agent_weave: ^0.1.0-dev.1
  agent_weave_openai: ^0.1.0-dev.1
  agent_weave_anthropic: ^0.1.0-dev.1
  agent_weave_ollama: ^0.1.0-dev.1
  agent_weave_dart_frog: ^0.1.0-dev.1
  agent_weave_openrouter: ^0.1.0-dev.1
  agent_weave_together: ^0.1.0-dev.1
  agent_weave_http: ^0.1.0-dev.1
  agent_weave_cloudflare: ^0.1.0-dev.1
  agent_weave_vercel_gateway: ^0.1.0-dev.1
  lints: ^6.0.0
  test: ^1.29.0
  http: ^1.6.0
dependency_overrides:
  tanstack_ai_dart:
    git:
      url: https://github.com/seifalmotaz/tanstack-ai-dart.git
      ref: 819ff289e6dabc5f424208b07ea9ac6f399cdccc
