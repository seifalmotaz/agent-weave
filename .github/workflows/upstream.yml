name: Review upstream API changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 tool/audit_openai.py
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix tool/interop --ignore-scripts --no-audit --no-fund
      - run: node tool/interop/inventory.mjs --upstream
      - run: node tool/interop/gateway-inventory.mjs --upstream
