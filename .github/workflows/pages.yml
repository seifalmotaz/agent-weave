name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/docs-requirements.txt
      - run: python -m pip install -r tool/docs-requirements.txt
      - run: python -m unittest discover -s tool -p 'test_docs_site.py'
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .dart_tool/docs-site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5.0.1
