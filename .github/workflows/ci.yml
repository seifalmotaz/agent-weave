name: Dart packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.12.2', stable]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/interop/package-lock.json
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/check.dart
